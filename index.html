<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Turma do Saber — Escolha a matéria</title>
<style>
/* ============================================================
   TURMA DO SABER — Página inicial (menu de matérias)
   App educacional para crianças com TEA
   100% offline, sem dependências externas
   ============================================================ */
:root{
  --azul:        #4FA3E3;
  --azul-claro:  #DCEEFB;
  --azul-escuro: #15324F;
  --amarelo:     #FFD66B;
  --amarelo-cl:  #FFF4D1;
  --verde:       #6FCF97;
  --verde-esc:   #2F9E5E;
  --roxo:        #B190E8;
  --roxo-cl:     #F0E9FB;
  --laranja:     #F2994A;
  --texto:       #233044;
  --branco:      #FFFFFF;
  --sombra:      0 6px 18px rgba(34,48,68,.15);
  --raio:        22px;
  --transicao:   .3s ease;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
  font-size: 20px; line-height: 1.5; color: var(--texto);
  background: linear-gradient(135deg, var(--azul-claro), var(--roxo-cl) 45%, var(--amarelo-cl));
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
#app{ max-width: 760px; margin: 0 auto; padding: 18px 16px 48px; }
h1{ font-size: 34px; margin: 6px 0; }
.cartao{
  background: var(--branco); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 26px 22px; margin: 14px 0; text-align:center;
}
.subtitulo{ text-align:center; color: var(--roxo); font-weight:bold; margin: 0 0 6px; }
.saudacao{ text-align:center; font-size:22px; margin: 4px 0 14px; }

/* ---------- Mascote ---------- */
.mascote{ width:170px; height:200px; margin: 6px auto 4px; position:relative; }
.mascote .antena{ position:absolute; top:-2px; left:50%; width:6px; height:26px; background:#7d8aa0; transform:translateX(-50%); border-radius:4px; }
.mascote .antena::after{ content:""; position:absolute; top:-14px; left:50%; width:16px; height:16px; background: var(--amarelo); border-radius:50%; transform:translateX(-50%); box-shadow:0 0 0 4px var(--amarelo-cl); animation: brilho 1.4s ease-in-out infinite; }
@keyframes brilho{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.5)} }
.mascote .cabeca{ position:absolute; top:24px; left:50%; transform:translateX(-50%); width:150px; height:118px; background: var(--azul); border-radius:30px; box-shadow: inset 0 -10px 0 rgba(0,0,0,.08); }
.mascote .olhos{ position:absolute; top:42px; width:100%; display:flex; justify-content:center; gap:26px; }
.mascote .olho{ width:34px; height:34px; background:var(--branco); border-radius:50%; display:flex; align-items:center; justify-content:center; animation: piscar 4s infinite; }
.mascote .olho::after{ content:""; width:16px; height:16px; background:var(--azul-escuro); border-radius:50%; }
@keyframes piscar{ 0%, 92%, 100%{ transform: scaleY(1); } 95%, 97%{ transform: scaleY(.1); } }
.mascote .boca{ position:absolute; top:88px; left:50%; transform:translateX(-50%); width:60px; height:16px; background:var(--azul-escuro); border-radius:0 0 30px 30px; }
.mascote .corpo{ position:absolute; top:140px; left:50%; transform:translateX(-50%); width:110px; height:56px; background: var(--roxo); border-radius:18px; }

/* ---------- Botões de matéria ---------- */
.materias{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:10px; }
@media (min-width:560px){ .materias{ grid-template-columns:1fr 1fr; } }

.materia{
  display:flex; align-items:center; gap:16px; text-align:left; text-decoration:none;
  color: var(--branco); border-radius: 18px; padding: 18px 20px; min-height: 92px;
  box-shadow: 0 4px 0 rgba(0,0,0,.12);
  transition: transform var(--transicao), box-shadow var(--transicao);
}
.materia:hover{ transform: translateY(-3px); box-shadow: 0 7px 0 rgba(0,0,0,.12); }
.materia:active{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
.materia:focus-visible{ outline: 4px solid var(--azul-escuro); outline-offset: 3px; }
.materia .ico{ font-size: 52px; line-height:1; flex:0 0 auto; }
.materia .txt b{ display:block; font-size: 24px; }
.materia .txt span{ display:block; font-size: 16px; opacity:.95; font-weight:normal; }

.m-historia  { background: var(--azul); }
.m-ciencias  { background: var(--verde-esc); }
.m-portugues { background: var(--roxo); }
.m-geografia { background: var(--laranja); }

.rodape{ font-size:15px; color:#6b7890; text-align:center; margin-top:20px; }
</style>
</head>
<body>
<div id="app">
  <div class="cartao">
    <h1>Turma do Saber 📚</h1>
    <p class="subtitulo">Aprender brincando!</p>

    <div class="mascote" role="img" aria-label="Mascote robô que pisca os olhos">
      <span class="antena"></span>
      <div class="cabeca">
        <div class="olhos"><span class="olho"></span><span class="olho"></span></div>
        <span class="boca"></span>
      </div>
      <div class="corpo"></div>
    </div>

    <p class="saudacao">Olá! 👋 Escolha a matéria para estudar:</p>

    <nav class="materias">
      <a class="materia m-historia" href="Turma-do-Saber-Historia.html" aria-label="Estudar História">
        <span class="ico" aria-hidden="true">🏛️</span>
        <span class="txt"><b>História</b><span>O trabalho na comunidade</span></span>
      </a>
      <a class="materia m-ciencias" href="Turma-do-Saber-Ciencias.html" aria-label="Estudar Ciências">
        <span class="ico" aria-hidden="true">🔬</span>
        <span class="txt"><b>Ciências</b><span>Conteúdo do bimestre</span></span>
      </a>
      <a class="materia m-portugues" href="Turma-do-Saber-Portugues.html" aria-label="Estudar Português">
        <span class="ico" aria-hidden="true">✏️</span>
        <span class="txt"><b>Português</b><span>Ortografia: Ç, H, C, X/CH</span></span>
      </a>
      <a class="materia m-geografia" href="Turma-do-Saber-Geografia.html" aria-label="Estudar Geografia">
        <span class="ico" aria-hidden="true">🌎</span>
        <span class="txt"><b>Geografia</b><span>Campo e cidade + caça-palavras</span></span>
      </a>
    </nav>

    <p class="rodape">Cada matéria tem conteúdo de estudo, simulado e histórico. 🌟</p>
  </div>
</div>
</body>
</html>
